name: Deploy ICEMAN Ecuador to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: iceman-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: pages-production
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python for responsive image optimization
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax and run regression tests
        run: |
          node --check app.js
          node --check motion-experience.js
          node --test tests/*.test.cjs
      - name: Install image optimizer
        run: python -m pip install Pillow==11.3.0
      - name: Build optimized production site
        run: python scripts/build_site.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload optimized site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
