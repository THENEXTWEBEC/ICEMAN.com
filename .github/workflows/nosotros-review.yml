name: Nosotros visual review
on:
  pull_request:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'nosotros-flow.css'
      - 'tests/nosotros*'
      - '.github/workflows/nosotros-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check syntax and regression tests
        run: |
          node --check app.js
          node --test tests/*.test.cjs
      - name: Build production site
        run: |
          python -m pip install Pillow==11.3.0
          python scripts/build_site.py
      - name: Prepare browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Review desktop, mobile, reverse scroll and reduced motion
        run: |
          python -m http.server 4173 --bind 127.0.0.1 --directory _site >/tmp/iceman-preview.log 2>&1 &
          node tests/nosotros-browser.cjs
